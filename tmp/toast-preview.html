<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      body {
        min-height: 100vh;
      }

      .preview-page {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      class="preview-page"
      src="../contacto/index.html"
      title="Vista de contacto"
    ></iframe>
    <div class="toast-container has-toast" id="toast-container">
      <div
        class="toast toast--success is-visible"
        role="dialog"
        aria-modal="true"
        aria-labelledby="toast-preview-title"
        aria-describedby="toast-preview-message"
      >
        <button
          class="toast-close"
          type="button"
          aria-label="Cerrar notificacion"
        >
          x
        </button>
        <span class="toast-icon" aria-hidden="true">✓</span>
        <div class="toast-content">
          <h2 class="toast-title" id="toast-preview-title">
            Consulta enviada
          </h2>
          <p class="toast-message" id="toast-preview-message">
            ¡Gracias! Tu consulta fue enviada. Te responderemos pronto.
          </p>
          <button class="button button--primary toast-action" type="button">
            Entendido
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
